<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — ROSEDRESS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600&family=Crimson+Text:ital,wght@0,400;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body class="relative">

<div id="header-holder"></div>

<section class="pt-40 pb-16 px-6 md:px-16 bg-[#f6f2ec]">
  <div class="max-w-7xl mx-auto">
    <p class="eyebrow mb-4">Contact</p>
    <h1 class="text-4xl md:text-6xl font-serif font-light leading-tight">Get in Touch</h1>
  </div>
</section>

<section class="pb-24 px-6 md:px-16">
  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20">
    <div class="reveal-left">
      <h2 class="text-2xl font-serif font-light mb-8">Send us a note</h2>
      <form id="contactForm" class="space-y-5" novalidate>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <input id="cfName" type="text" placeholder="Name" required class="bg-white border border-[#9c8b77]/20 px-5 py-4 text-sm font-light focus:outline-none focus:border-[#c9a876] transition-all">
          <input id="cfEmail" type="email" placeholder="Email" required class="bg-white border border-[#9c8b77]/20 px-5 py-4 text-sm font-light focus:outline-none focus:border-[#c9a876] transition-all">
        </div>
        <input id="cfSubject" type="text" placeholder="Subject" class="bg-white border border-[#9c8b77]/20 px-5 py-4 text-sm font-light focus:outline-none focus:border-[#c9a876] transition-all w-full">
        <textarea id="cfMessage" placeholder="Message" rows="6" required class="bg-white border border-[#9c8b77]/20 px-5 py-4 text-sm font-light focus:outline-none focus:border-[#c9a876] transition-all w-full resize-none"></textarea>
        <button type="submit" class="btn-champagne solid px-10 py-4 text-[11px] tracking-[0.3em] uppercase">Send Message</button>
        <div id="cfNote" class="hidden text-sm text-[#c9a876] italic font-classic">Demo form — this site has no backend, so no message is actually sent.</div>
      </form>
    </div>

    <div class="reveal-right space-y-8 lg:pt-24">
      <div>
        <h3 class="text-[11px] tracking-[0.3em] uppercase font-bold text-[#c9a876] mb-3">Boutique</h3>
        <p class="text-sm text-gray-500 font-light leading-loose">ROSEDRESS<br>Annaba, Algeria<br><span class="italic font-classic">precise address to be confirmed</span></p>
      </div>
      <div>
        <h3 class="text-[11px] tracking-[0.3em] uppercase font-bold text-[#c9a876] mb-3">Follow</h3>
        <a href="https://www.instagram.com/rosedressdz/" target="_blank" rel="noopener" class="inline-flex items-center gap-2 text-sm text-gray-500 font-light hover:text-[#c9a876] transition-colors"><iconify-icon icon="lucide:instagram" class="text-lg"></iconify-icon> @rosedressdz</a>
      </div>
      <div class="editorial-img">
        <img src="https://images.pexels.com/photos/18116163/pexels-photo-18116163.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Rosedress boutique" loading="lazy" class="w-full aspect-[4/3] object-cover shadow-lg rounded-sm">
      </div>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="js/products.js"></script>
<script src="js/layout.js"></script>
<script>
(function(){
  var form = document.getElementById('contactForm');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(!form.checkValidity()){ form.reportValidity(); return; }
    var n = document.getElementById('cfNote');
    n.classList.remove('hidden');
    setTimeout(function(){ n.classList.add('hidden'); },4000);
    form.reset();
  });
})();
</script>
</body>
</html>
