<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lookbook — ROSEDRESS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600&family=Crimson+Text:ital,wght@0,400;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body class="relative">

<div id="header-holder"></div>

<section class="pt-40 pb-16 px-6 md:px-16 bg-[#f6f2ec]">
  <div class="max-w-7xl mx-auto">
    <p class="eyebrow mb-4">The Editorial</p>
    <h1 class="text-4xl md:text-6xl font-serif font-light leading-tight">Lookbook</h1>
    <p class="mt-6 max-w-xl text-gray-500 font-light">A first look at how ROSEDRESS pieces move and gather. Full editorial photography to follow.</p>
  </div>
</section>

<section class="pb-24 px-6 md:px-16">
  <div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 gap-8 md:gap-10">
    <div class="editorial-img reveal-left">
      <img src="https://images.pexels.com/photos/18116163/pexels-photo-18116163.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Rosedress Editorial 1" loading="lazy" class="w-full aspect-[3/4] object-cover shadow-lg rounded-sm">
    </div>
    <div class="editorial-img reveal-right">
      <img src="https://images.pexels.com/photos/8995843/pexels-photo-8995843.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Rosedress Editorial 2" loading="lazy" class="w-full aspect-[3/4] object-cover shadow-lg rounded-sm">
    </div>
    <div class="editorial-img reveal-left">
      <img src="https://images.pexels.com/photos/18116163/pexels-photo-18116163.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Rosedress Editorial 3" loading="lazy" class="w-full aspect-[3/4] object-cover shadow-lg rounded-sm">
    </div>
    <div class="editorial-img reveal-right">
      <img src="https://images.pexels.com/photos/8995843/pexels-photo-8995843.jpeg?auto=compress&cs=tinysrgb&w=900" alt="Rosedress Editorial 4" loading="lazy" class="w-full aspect-[3/4] object-cover shadow-lg rounded-sm">
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="js/products.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
