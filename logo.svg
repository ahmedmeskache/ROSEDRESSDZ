<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a876"/>
      <stop offset="1" stop-color="#a9835a"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5433a"/>
      <stop offset="1" stop-color="#7e2a26"/>
    </linearGradient>
  </defs>

  <!-- Rose emblem -->
  <g transform="translate(52,60)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.6"/>
    <!-- outer petals -->
    <g fill="url(#roseGrad)" opacity="0.85">
      <ellipse cx="0" cy="-18" rx="11" ry="16" transform="rotate(0)"/>
      <ellipse cx="17" cy="-6" rx="11" ry="16" transform="rotate(72)"/>
      <ellipse cx="11" cy="14" rx="11" ry="16" transform="rotate(144)"/>
      <ellipse cx="-11" cy="14" rx="11" ry="16" transform="rotate(216)"/>
      <ellipse cx="-17" cy="-6" rx="11" ry="16" transform="rotate(288)"/>
    </g>
    <!-- inner petals -->
    <g fill="#c05a50">
      <ellipse cx="0" cy="-11" rx="8" ry="12" transform="rotate(36)"/>
      <ellipse cx="11" cy="0" rx="8" ry="12" transform="rotate(108)"/>
      <ellipse cx="-11" cy="0" rx="8" ry="12" transform="rotate(180)"/>
      <ellipse cx="0" cy="11" rx="8" ry="12" transform="rotate(252)"/>
      <ellipse cx="-11" cy="-11" rx="8" ry="12" transform="rotate(324)"/>
    </g>
    <!-- center spiral -->
    <g fill="none" stroke="#f2d9b8" stroke-width="2.2" stroke-linecap="round">
      <path d="M -1 0 Q 0 -6 6 -6 Q 12 -6 12 0 Q 12 6 6 6 Q 0 6 0 0"/>
      <path d="M 12 0 Q 12 -12 0 -12 Q -12 -12 -12 0 Q -12 12 0 12"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(116,80)">
    <text font-family="'Playfair Display', 'Georgia', serif" font-size="46" font-weight="600" letter-spacing="6" fill="#1f1d1c">ROSE</text>
    <text x="112" y="0" font-family="'Playfair Display', 'Georgia', serif" font-size="46" font-weight="400" font-style="italic" letter-spacing="6" fill="url(#gold)">Dress</text>
    <text x="218" y="0" font-family="'Playfair Display', 'Georgia', serif" font-size="46" font-weight="600" letter-spacing="6" fill="#1f1d1c">DZ</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(120,104)">
    <text font-family="'Plus Jakarta Sans', 'Arial', sans-serif" font-size="11" letter-spacing="5" fill="#9c8b77">MODEST LUXURY, REDEFINED</text>
  </g>
</svg>