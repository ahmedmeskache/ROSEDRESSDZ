<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bag — ROSEDRESS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600&family=Crimson+Text:ital,wght@0,400;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body class="relative">

<div id="header-holder"></div>

<section class="pt-40 pb-16 px-6 md:px-16 bg-[#f6f2ec]">
  <div class="max-w-7xl mx-auto">
    <p class="eyebrow mb-4">Your Bag</p>
    <h1 class="text-4xl md:text-6xl font-serif font-light leading-tight">Shopping Bag</h1>
  </div>
</section>

<section class="pb-24 px-6 md:px-16">
  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-12">
    <div class="lg:col-span-2" id="cartList"></div>

    <div class="lg:sticky lg:top-28 h-fit bg-white border border-[#f6f2ec] shadow-sm p-8">
      <h3 class="text-[11px] tracking-[0.3em] uppercase font-bold mb-6">Order Summary</h3>
      <div class="flex justify-between text-sm font-light text-gray-500 mb-3"><span>Subtotal</span><span id="subtotal">0 DZD</span></div>
      <div class="flex justify-between text-sm font-light text-gray-500 mb-3"><span>Delivery</span><span class="italic font-classic">To be confirmed</span></div>
      <div class="border-t border-[#9c8b77]/15 my-5 pt-5 flex justify-between font-semibold"><span>Total</span><span id="total">0 DZD</span></div>
      <button id="checkoutBtn" class="btn-champagne solid w-full px-6 py-4 text-[11px] tracking-[0.3em] uppercase">Checkout</button>
      <div id="checkoutNote" class="hidden mt-4 text-sm text-[#c9a876] italic font-classic text-center">Demo checkout — no payment is processed.</div>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="js/products.js"></script>
<script src="js/layout.js"></script>
<script>
(function(){
  function render(){
    var list = document.getElementById('cartList');
    var cart = ROSEDRESS.getCart();
    if(!cart.length){
      list.innerHTML =
        '<div class="text-center py-24">'+
          '<p class="text-gray-400 italic font-classic mb-8">Your bag is empty.</p>'+
          '<a href="shop.html" class="btn-champagne solid px-10 py-4 text-[11px] tracking-[0.3em] uppercase inline-block">Shop the Collection</a>'+
        '</div>';
    } else {
      list.innerHTML = '<div class="space-y-6">' + cart.map(function(item){
        var p = ROSEDRESS.getProduct(item.id);
        if(!p) return '';
        return ''+
          '<div class="flex gap-6 bg-white border border-[#f6f2ec] shadow-sm p-4 md:p-6" data-id="'+p.id+'" data-size="'+item.size+'">'+
            '<a href="product.html?id='+p.id+'" class="w-24 md:w-32 shrink-0 overflow-hidden rounded-sm" style="background:linear-gradient(160deg,#e2cfae,#b08f63)">'+
              '<img src="'+ROSEDRESS.img(p)+'" alt="'+p.name+'" class="w-full h-full aspect-[3/4] object-cover">'+
            '</a>'+
            '<div class="flex-1 text-left">'+
              '<div class="flex justify-between gap-4">'+
                '<div>'+
                  '<h4 class="text-sm tracking-widest uppercase font-semibold mb-1"><a href="product.html?id='+p.id+'" class="hover:text-[#c9a876] transition-colors">'+p.name+'</a></h4>'+
                  '<span class="text-xs text-[#9c8b77] font-light">'+ROSEDRESS.money(p.price)+'</span>'+
                  (item.size ? '<span class="block text-xs text-[#9c8b77] font-light mt-1">Size: '+item.size+'</span>' : '')+
                '</div>'+
                '<button class="remove-btn text-[#9c8b77] hover:text-[#1f1d1c] transition-colors" aria-label="Remove"><iconify-icon icon="lucide:x"></iconify-icon></button>'+
              '</div>'+
              '<div class="flex items-center gap-3 mt-6">'+
                '<button class="qty-btn down border border-[#9c8b77]/20 w-9 h-9 flex items-center justify-center hover:border-[#c9a876] transition-colors">−</button>'+
                '<span class="w-8 text-center text-sm font-light">'+item.qty+'</span>'+
                '<button class="qty-btn up border border-[#9c8b77]/20 w-9 h-9 flex items-center justify-center hover:border-[#c9a876] transition-colors">+</button>'+
                '<span class="ml-auto text-sm font-semibold">'+ROSEDRESS.money(p.price*item.qty)+'</span>'+
              '</div>'+
            '</div>'+
          '</div>';
      }).join('') + '</div>';
    }

    var subtotal = cart.reduce(function(s,i){ var p=ROSEDRESS.getProduct(i.id); return s + (p?p.price*i.qty:0); },0);
    document.getElementById('subtotal').textContent = ROSEDRESS.money(subtotal);
    document.getElementById('total').textContent = ROSEDRESS.money(subtotal);

    list.querySelectorAll('.qty-btn').forEach(function(b){
      b.addEventListener('click', function(){
        var row = b.closest('[data-id]');
        var id = row.dataset.id, size = row.dataset.size;
        var cart = ROSEDRESS.getCart();
        var item = cart.find(function(i){ return i.id===id && i.size===size; });
        if(!item) return;
        if(b.classList.contains('up')) item.qty++;
        else { item.qty--; if(item.qty<1){ cart = cart.filter(function(i){ return !(i.id===id && i.size===size); }); } }
        ROSEDRESS.saveCart(cart); render();
      });
    });
    list.querySelectorAll('.remove-btn').forEach(function(b){
      b.addEventListener('click', function(){
        var row = b.closest('[data-id]');
        var id = row.dataset.id, size = row.dataset.size;
        var cart = ROSEDRESS.getCart().filter(function(i){ return !(i.id===id && i.size===size); });
        ROSEDRESS.saveCart(cart); render();
      });
    });
    ROSEDRESS.updateCartCount();
  }

  document.getElementById('checkoutBtn').addEventListener('click', function(){
    var n = document.getElementById('checkoutNote');
    n.classList.remove('hidden');
    setTimeout(function(){ n.classList.add('hidden'); },4000);
  });

  render();
})();
</script>
</body>
</html>
